name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exploit and defense tests
        run: python -m unittest discover -s tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer audit

  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - name: Scan the safe site
        run: semgrep scan --config p/php --error safe/
      - name: Scan the vulnerable site (findings expected)
        run: semgrep scan --config p/php vulnerable/ || true
